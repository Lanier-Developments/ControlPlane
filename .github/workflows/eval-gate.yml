name: eval-gate

# Fast, deterministic checks. Everything here blocks a merge, so everything here has
# to finish in minutes: no chat model, no answer generation.
#
# The full tier (44 sequential generations) moved to eval-full.yml on a nightly
# schedule. A gate nobody waits for is a gate nobody reads.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Pure policy evaluation: no database, no model, no network. Runs in seconds and
  # should be the first thing that goes red, so it is its own job rather than a step
  # behind a Postgres service and a model pull.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Registry and routing policy
        run: python -m provenance.policy_test

  # Discoverability, not correctness: confirms the GitHub About description and
  # topics are set. Independent of the policy/eval jobs — it reads the GitHub API,
  # not this repo's code, and a rename or repo edit shouldn't have to wait on Ollama.
  repo-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Repo metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m provenance.repo_meta_check

  # Retrieval tier plus row-level security. Embeddings only — no generation — so this
  # is minutes rather than the half hour the full tier takes on a shared runner.
  eval-retrieval:
    runs-on: ubuntu-latest
    needs: policy

    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      APP_DATABASE_URL: postgresql+psycopg://rag_app:rag_app@localhost:5432/rag
      OLLAMA_BASE_URL: http://localhost:11434
      EMBED_MODEL: nomic-embed-text
      TOP_K: "8"
      MODELS_DIR: /home/runner/ollama-models

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-retries 10
      ollama:
        image: ollama/ollama
        ports: ["11434:11434"]
        volumes:
          - /home/runner/ollama-models:/root/.ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore model cache
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ollama-${{ env.EMBED_MODEL }}-embed-only

      - name: Pull embedding model
        run: |
          curl -sf "$OLLAMA_BASE_URL/api/pull" \
            -d "{\"model\": \"$EMBED_MODEL\", \"stream\": false}" > /dev/null

      - name: Save model cache
        if: steps.models.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$MODELS_DIR"

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Install
        run: pip install -e .

      - name: Apply schema
        run: python -m provenance.ingest --migrate

      - name: Ingest corpus
        run: python -m provenance.ingest --reset

      # Enforcement is checked before the gate runs. A green gate on a database that
      # is not enforcing row-level security would be a green light for nothing.
      - name: Row-level security
        run: python -m provenance.rls_test

      - name: Score golden set (retrieval tier)
        run: python -m provenance.evals --tier retrieval --report eval-report-retrieval.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-retrieval
          path: eval-report-retrieval.json
