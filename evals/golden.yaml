# ---------------------------------------------------- authority conflict
# ENG-010 says access logs are kept 2 years. LEG-001 v2 sets 7 years and states
# the schedule governs where a departmental standard disagrees. Both are visible
# to sam, and the retired LEG-001 v1 also says 2 years. Getting this right means
# honoring a stated precedence rule, not just preferring the newer document.

- id: G11
  persona: sam
  category: authority-conflict
  question: How long do we retain access and audit logs?
  expected_sources: [LEG-001 v2]
  must_include: ["7 years"]

- id: G12
  persona: priya
  category: authority-conflict
  question: If an engineering standard and the records retention schedule disagree on a retention period, which one do we follow?
  expected_sources: [LEG-001 v2]
  must_include: ["schedule"]

