# Golden set.
#
# category: factual | table | version-conflict | authority-conflict | near-duplicate
#           | audience-split | permission-denied | permission-allowed | unanswerable
#
# expected_sources: doc_id vN that must be retrieved AND cited. Empty means nothing
#   should be cited and the answer must decline.
# must_include / must_not_include: case-insensitive substrings.
#
# Rule for authoring: only assert expected_sources when the fact is unique to that
# document WITHIN THE PERSONA'S VISIBLE SET. A fact stated in three documents will
# fail citation_missing at random depending on which one the model picks. Several
# items below rely on permission-scoped uniqueness — the same fact appears in an
# internal document too, but the persona cannot see it.

# ---------------------------------------------------------------- originals

- id: G01
  persona: sam
  category: version-conflict
  question: How many PTO days do full-time employees get per year?
  expected_sources: [HR-001 v2]
  must_include: ["20"]
  must_not_include: ["15 days"]

