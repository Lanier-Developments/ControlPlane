# Model registry. Adding, deprecating, or repricing a model is a change to this file
# and nothing else — no code change, no redeploy of the application logic.
#
# This is the direct lesson from a prior control-plane build where model selection ran
# off an enum in code: every new provider meant a pull request, a release, and a
# rollback risk, and the list of what was actually approved lived in three places.
#
# tier:            local | cloud — where inference happens, which is what data
#                  classification policy keys on
# status:          approved | deprecated | retired. Deprecated still answers but
#                  is logged as such; retired is refused.
# max_classification: the most sensitive data this model may ever see
# cost_per_1k:     USD per 1000 tokens, used for cost attribution

models:
  - id: ollama/llama3.1:8b
    provider: ollama
    model: llama3.1:8b
    tier: local
    status: approved
    max_classification: restricted
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    notes: Runs on self-hosted hardware. No data leaves the network.

  - id: ollama/llama3.2:3b
    provider: ollama
    model: llama3.2:3b
    tier: local
    status: approved
    max_classification: restricted
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    notes: Small model used by CI. Accurate enough for gate wiring, not for answers.

  - id: bedrock/claude-sonnet-4-6
    provider: bedrock
    model: us.anthropic.claude-sonnet-4-6
    tier: cloud
    status: approved
    max_classification: internal
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    no_temperature: true
    notes: >-
      Approved for public and internal content only. Confidential and restricted
      content falls back to self-hosted inference by policy, not by configuration.
      Cross-region inference profile (us. prefix): AWS may route the request to any
      US region, which is a data-residency question the registry does not yet model.
      Sonnet 5 is gated separately for this account and is not usable here.

  - id: ollama/llama2:7b
    provider: ollama
    model: llama2:7b
    tier: local
    status: retired
    max_classification: restricted
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    notes: Superseded. Present on purpose — a retired entry must be refused, not ignored.

default_model: ollama/llama3.1:8b
