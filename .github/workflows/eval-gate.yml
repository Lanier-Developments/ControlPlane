name: eval-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Pure policy evaluation: no database, no model, no network. Runs in seconds and
  # should be the first thing that goes red, so it is its own job rather than a step
  # behind a Postgres service and a model pull.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Registry and routing policy
        run: python -m provenance.policy_test

  # Discoverability, not correctness: confirms the GitHub About description and
  # topics are set. Independent of the policy/eval jobs — it reads the GitHub API,
  # not this repo's code, and a rename or repo edit shouldn't have to wait on Ollama.
  repo-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Repo metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m provenance.repo_meta_check

  eval:
    runs-on: ubuntu-latest
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        tier: [retrieval, full]
    # Retrieval tier blocks merges. Full tier is advisory: a 3B model's answer-quality
    # misses are noise, not signal. Point DEFAULT_MODEL at a real model and drop this
    # when the full tier should block.
    continue-on-error: ${{ matrix.tier == 'full' }}

    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      APP_DATABASE_URL: postgresql+psycopg://rag_app:rag_app@localhost:5432/rag
      OLLAMA_BASE_URL: http://localhost:11434
      EMBED_MODEL: nomic-embed-text
      # Model selection comes from policy/models.yaml, not from a provider setting.
      # This must name a registry entry, and CI must pull the model it points to.
      DEFAULT_MODEL: ollama/llama3.2:3b
      CI_CHAT_MODEL: llama3.2:3b
      TOP_K: "8"
      MODELS_DIR: /home/runner/ollama-models

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-retries 10
      ollama:
        image: ollama/ollama
        ports: ["11434:11434"]
        volumes:
          - /home/runner/ollama-models:/root/.ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore model cache
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ollama-${{ env.EMBED_MODEL }}-${{ matrix.tier == 'full' && env.CI_CHAT_MODEL || 'embed-only' }}

      - name: Pull models
        run: |
          pull() { curl -sf "$OLLAMA_BASE_URL/api/pull" -d "{\"model\": \"$1\", \"stream\": false}" > /dev/null; }
          pull "$EMBED_MODEL"
          if [ "${{ matrix.tier }}" = "full" ]; then pull "$CI_CHAT_MODEL"; fi

      - name: Save model cache
        if: steps.models.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$MODELS_DIR"

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Install
        run: pip install -e .

      - name: Apply schema
        run: python -m provenance.ingest --migrate

      - name: Ingest corpus
        run: python -m provenance.ingest --reset

      # Enforcement is checked before the gate runs. A green gate on a database that
      # is not enforcing row-level security would be a green light for nothing.
      - name: Row-level security
        run: python -m provenance.rls_test

      - name: Score golden set
        run: python -m provenance.evals --tier ${{ matrix.tier }} --report eval-report-${{ matrix.tier }}.json

      - name: Model call log
        if: always()
        run: python -m provenance.usage --hours 24

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.tier }}
          path: eval-report-${{ matrix.tier }}.json
