name: eval-full

# Answer-quality tier and red team. Both generate, both are slow, neither blocks a
# merge — so they run nightly and on demand rather than on every push.
#
# On a shared runner with no GPU, 44 sequential generations take 25-40 minutes. That
# is tolerable overnight and intolerable on a pull request.

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC, after the working day in US timezones
  workflow_dispatch:
    inputs:
      judge:
        description: "Also run the LLM attribution judge (slower)"
        type: boolean
        default: false

jobs:
  full:
    runs-on: ubuntu-latest
    # Advisory. A 3B model's answer-quality misses are noise, not signal — the run
    # is worth reading, not worth blocking on. Switch to Bedrock (below) before
    # treating a red result here as a defect in the system rather than in the model.
    continue-on-error: true

    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      APP_DATABASE_URL: postgresql+psycopg://rag_app:rag_app@localhost:5432/rag
      OLLAMA_BASE_URL: http://localhost:11434
      EMBED_MODEL: nomic-embed-text
      # Model selection comes from policy/models.yaml, not from a provider setting.
      # This must name a registry entry, and CI must pull the model it points to.
      DEFAULT_MODEL: ollama/llama3.2:3b
      CI_CHAT_MODEL: llama3.2:3b
      TOP_K: "8"
      MODELS_DIR: /home/runner/ollama-models

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-retries 10
      ollama:
        image: ollama/ollama
        ports: ["11434:11434"]
        volumes:
          - /home/runner/ollama-models:/root/.ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore model cache
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ollama-${{ env.EMBED_MODEL }}-${{ env.CI_CHAT_MODEL }}

      - name: Pull models
        run: |
          pull() { curl -sf "$OLLAMA_BASE_URL/api/pull" -d "{\"model\": \"$1\", \"stream\": false}" > /dev/null; }
          pull "$EMBED_MODEL"
          pull "$CI_CHAT_MODEL"

      - name: Save model cache
        if: steps.models.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$MODELS_DIR"

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Install
        run: pip install -e .

      - name: Apply schema
        run: python -m provenance.ingest --migrate

      - name: Ingest corpus
        run: python -m provenance.ingest --reset

      - name: Row-level security
        run: python -m provenance.rls_test

      - name: Score golden set (full tier)
        run: |
          python -m provenance.evals --tier full \
            ${{ inputs.judge && '--judge' || '' }} \
            --report eval-report-full.json

      # Prompt injection. Always advisory: two attacks currently succeed against the
      # local model and are documented in docs/FINDINGS.md, so a non-zero exit here
      # is expected until the baseline is clean.
      - name: Red team
        continue-on-error: true
        run: python -m provenance.redteam --user sam

      - name: Model call log
        if: always()
        run: python -m provenance.usage --hours 24

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-full
          path: |
            eval-report-full.json
            redteam-report.json

# ---------------------------------------------------------------------------
# Bedrock via GitHub OIDC — the intended replacement for local inference here.
#
# Why: 44 sequential generations on a shared CPU runner take 25-40 minutes. Bedrock
# turns that into minutes, and running the same 44 items against Claude and against
# llama3.1:8b gives a model-to-model comparison on a fixed scoring set, which is a
# more interesting result than either run alone.
#
# Setup, once AWS access is available:
#
# 1. Create an IAM OIDC identity provider for token.actions.githubusercontent.com
#    (thumbprint is managed by AWS now; the console offers it).
#
# 2. Create a role whose trust policy scopes to this repo, and to a branch or
#    environment rather than to the whole repo:
#
#      "Condition": {
#        "StringEquals": {
#          "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#        },
#        "StringLike": {
#          "token.actions.githubusercontent.com:sub":
#            "repo:Lanier-Developments/ControlPlane:ref:refs/heads/main"
#        }
#      }
#
#    A trust policy that omits the `sub` condition can be assumed by any repo on
#    GitHub. That is the one mistake worth being careful about here.
#
# 3. Attach a policy granting only bedrock:InvokeModel on the specific model or
#    inference profile ARN. No wildcard.
#
# 4. Add to this job:
#
#      permissions:
#        id-token: write
#        contents: read
#
#      - uses: aws-actions/configure-aws-credentials@v4
#        with:
#          role-to-assume: arn:aws:iam::<account>:role/<role-name>
#          aws-region: us-east-1
#
# 5. Set the registry model id in policy/models.yaml (bedrock/claude-sonnet has an
#    empty `model:` field waiting for it), then set DEFAULT_MODEL to that entry and
#    drop the ollama service and the chat-model pull.
#
# Note the governance consequence, which is the interesting part: the corpus contains
# confidential and restricted documents, and the registry caps bedrock/claude-sonnet
# at `internal`. Those items will be REFUSED rather than answered by the cloud model —
# `make usage` will show the denials and the rule that produced them. That is the
# policy working, not a misconfiguration, and it is worth keeping in the report.
# ---------------------------------------------------------------------------
