name: eval-full

# Answer-quality tier and red team. Both generate, both are slow, neither blocks a
# merge — so they run nightly and on demand rather than on every push.
#
# On a shared runner with no GPU, 44 sequential generations take 25-40 minutes. That
# is tolerable overnight and intolerable on a pull request.
#
# They gate differently. Answer quality from a 3B model is advisory: its misses are
# noise. Prompt injection from the same model is signal — whether the system treats
# retrieved text as data does not need a smart model to measure — so the red team
# jobs (local 3B always; Bedrock Sonnet once AWS_CI_ROLE_ARN is set) fail the
# workflow on any finding outside evals/redteam-baseline.yaml.

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC, after the working day in US timezones
  workflow_dispatch:
    inputs:
      judge:
        description: "Also run the LLM attribution judge (slower)"
        type: boolean
        default: false

jobs:
  full:
    runs-on: ubuntu-latest
    # Advisory. A 3B model's answer-quality misses are noise, not signal — the run
    # is worth reading, not worth blocking on. Switch to Bedrock (below) before
    # treating a red result here as a defect in the system rather than in the model.
    continue-on-error: true

    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      APP_DATABASE_URL: postgresql+psycopg://rag_app:rag_app@localhost:5432/rag
      OLLAMA_BASE_URL: http://localhost:11434
      EMBED_MODEL: nomic-embed-text
      # Model selection comes from policy/models.yaml, not from a provider setting.
      # This must name a registry entry, and CI must pull the model it points to.
      DEFAULT_MODEL: ollama/llama3.2:3b
      CI_CHAT_MODEL: llama3.2:3b
      TOP_K: "8"
      MODELS_DIR: /home/runner/ollama-models

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-retries 10
      ollama:
        image: ollama/ollama
        ports: ["11434:11434"]
        volumes:
          - /home/runner/ollama-models:/root/.ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore model cache
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ollama-${{ env.EMBED_MODEL }}-${{ env.CI_CHAT_MODEL }}

      - name: Pull models
        run: |
          pull() { curl -sf "$OLLAMA_BASE_URL/api/pull" -d "{\"model\": \"$1\", \"stream\": false}" > /dev/null; }
          pull "$EMBED_MODEL"
          pull "$CI_CHAT_MODEL"

      - name: Save model cache
        if: steps.models.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$MODELS_DIR"

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Install
        run: pip install -e .

      - name: Apply schema
        run: python -m provenance.ingest --migrate

      - name: Ingest corpus
        run: python -m provenance.ingest --reset

      - name: Row-level security
        run: python -m provenance.rls_test

      - name: Score golden set (full tier)
        run: |
          python -m provenance.evals --tier full \
            ${{ inputs.judge && '--judge' || '' }} \
            --report eval-report-full.json

      - name: Model call log
        if: always()
        run: python -m provenance.usage --hours 24

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-full
          path: eval-report-full.json

  # Prompt injection, gated by the ratchet in evals/redteam-baseline.yaml: a finding
  # outside the model's accepted list — or an accepted finding that now holds — fails
  # this job, and this job fails the workflow. Its own job rather than a step above
  # because the eval job is advisory (continue-on-error) and would swallow the exit
  # code; a gate that cannot turn anything red is not a gate.
  redteam:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      APP_DATABASE_URL: postgresql+psycopg://rag_app:rag_app@localhost:5432/rag
      OLLAMA_BASE_URL: http://localhost:11434
      EMBED_MODEL: nomic-embed-text
      # Must name a registry entry with a baseline section in
      # evals/redteam-baseline.yaml, and CI must pull the model it points to.
      DEFAULT_MODEL: ollama/llama3.2:3b
      CI_CHAT_MODEL: llama3.2:3b
      TOP_K: "8"
      MODELS_DIR: /home/runner/ollama-models

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-retries 10
      ollama:
        image: ollama/ollama
        ports: ["11434:11434"]
        volumes:
          - /home/runner/ollama-models:/root/.ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore model cache
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ollama-${{ env.EMBED_MODEL }}-${{ env.CI_CHAT_MODEL }}

      - name: Pull models
        run: |
          pull() { curl -sf "$OLLAMA_BASE_URL/api/pull" -d "{\"model\": \"$1\", \"stream\": false}" > /dev/null; }
          pull "$EMBED_MODEL"
          pull "$CI_CHAT_MODEL"

      - name: Save model cache
        if: steps.models.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$MODELS_DIR"

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Install
        run: pip install -e .

      - name: Apply schema
        run: python -m provenance.ingest --migrate

      - name: Ingest corpus
        run: python -m provenance.ingest --reset

      # The cases retrieve real benign context under real permissions, so enforcement
      # is checked first, same as the eval gate.
      - name: Row-level security
        run: python -m provenance.rls_test

      - name: Red team gate
        run: python -m provenance.redteam --user sam

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: redteam-report.json

  # The red team against Bedrock Claude, same OIDC auth as full-bedrock below, and
  # gating like the local redteam job: a finding outside the model's section in
  # evals/redteam-baseline.yaml fails the workflow. The model rejects temperature,
  # so runs are not reproducible — findings that come and go are accepted as
  # `flaky` entries in the baseline (with a reason), which gate in neither
  # direction; anything new is still a regression and still turns the nightly red.
  # This closes the section-15 caveat that the nightly watched only the 3B model.
  #
  # The exfiltration case retrieves confidential content, so the ceiling denies
  # Sonnet and the fallback answers — which is why this job pulls the local chat
  # model, and why those rows measure the fallback.
  redteam-bedrock:
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_CI_ROLE_ARN != '' }}

    permissions:
      id-token: write
      contents: read

    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      APP_DATABASE_URL: postgresql+psycopg://rag_app:rag_app@localhost:5432/rag
      OLLAMA_BASE_URL: http://localhost:11434
      EMBED_MODEL: nomic-embed-text
      # Must name a registry entry with a baseline section in
      # evals/redteam-baseline.yaml.
      DEFAULT_MODEL: bedrock/claude-sonnet-4-6
      FALLBACK_CHAT_MODEL: llama3.1:8b
      AWS_REGION: us-east-1
      TOP_K: "8"
      MODELS_DIR: /home/runner/ollama-models

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-retries 10
      ollama:
        image: ollama/ollama
        ports: ["11434:11434"]
        volumes:
          - /home/runner/ollama-models:/root/.ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Restore model cache
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ollama-${{ env.EMBED_MODEL }}-${{ env.FALLBACK_CHAT_MODEL }}

      - name: Pull models
        run: |
          pull() { curl -sf "$OLLAMA_BASE_URL/api/pull" -d "{\"model\": \"$1\", \"stream\": false}" > /dev/null; }
          pull "$EMBED_MODEL"
          pull "$FALLBACK_CHAT_MODEL"

      - name: Save model cache
        if: steps.models.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$MODELS_DIR"

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Install
        run: pip install -e .

      - name: Apply schema
        run: python -m provenance.ingest --migrate

      - name: Ingest corpus
        run: python -m provenance.ingest --reset

      - name: Row-level security
        run: python -m provenance.rls_test

      - name: Red team gate (Bedrock)
        run: python -m provenance.redteam --user sam --report redteam-report-bedrock.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report-bedrock
          path: redteam-report-bedrock.json

  # The full tier against Bedrock Claude, authenticated by GitHub OIDC — no stored
  # secret; the role trusts this repo's main branch and allows bedrock:InvokeModel
  # on the one registered model (infra/github-oidc-bedrock.sh creates it; the job
  # stays skipped until the AWS_CI_ROLE_ARN repo variable is set).
  #
  # Advisory like the 3B job, for a different reason: evals/baseline.yaml records
  # the local model's known failures, and a different model fails differently in
  # both directions, so regressions and stale entries here describe the diff, not a
  # break. It also is not reproducible the way the local runs are — the model
  # rejects temperature (see policy/models.yaml).
  #
  # The governance consequence is the interesting part: the registry caps this
  # model at `internal`, so the items that retrieve confidential or restricted
  # content are denied it and answered by the policy fallback (ollama/llama3.1:8b,
  # policy/routing.yaml) — which is why this job still pulls the local chat model.
  # Those rows report the fallback in their Model column, and the ledger holds the
  # denials. That is the policy working, not a misconfiguration.
  full-bedrock:
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_CI_ROLE_ARN != '' }}
    continue-on-error: true

    permissions:
      id-token: write
      contents: read

    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      APP_DATABASE_URL: postgresql+psycopg://rag_app:rag_app@localhost:5432/rag
      OLLAMA_BASE_URL: http://localhost:11434
      EMBED_MODEL: nomic-embed-text
      DEFAULT_MODEL: bedrock/claude-sonnet-4-6
      # The policy fallback answers the ceiling-denied items, so it must be present.
      FALLBACK_CHAT_MODEL: llama3.1:8b
      # The judge grades against restricted-classified context, which the ceiling
      # would deny the cloud model anyway; requesting the local model directly
      # saves a denial row per judged claim. Also the independence arrangement:
      # the grader is not the model that wrote the answers.
      JUDGE_MODEL: ollama/llama3.1:8b
      AWS_REGION: us-east-1
      TOP_K: "8"
      MODELS_DIR: /home/runner/ollama-models

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-retries 10
      ollama:
        image: ollama/ollama
        ports: ["11434:11434"]
        volumes:
          - /home/runner/ollama-models:/root/.ollama

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Restore model cache
        id: models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ollama-${{ env.EMBED_MODEL }}-${{ env.FALLBACK_CHAT_MODEL }}

      - name: Pull models
        run: |
          pull() { curl -sf "$OLLAMA_BASE_URL/api/pull" -d "{\"model\": \"$1\", \"stream\": false}" > /dev/null; }
          pull "$EMBED_MODEL"
          pull "$FALLBACK_CHAT_MODEL"

      - name: Save model cache
        if: steps.models.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "$MODELS_DIR"

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MODELS_DIR }}
          key: ${{ steps.models.outputs.cache-primary-key }}

      - name: Install
        run: pip install -e .

      - name: Apply schema
        run: python -m provenance.ingest --migrate

      - name: Ingest corpus
        run: python -m provenance.ingest --reset

      - name: Row-level security
        run: python -m provenance.rls_test

      - name: Score golden set (full tier, Bedrock)
        run: |
          python -m provenance.evals --tier full \
            ${{ inputs.judge && '--judge' || '' }} \
            --report eval-report-bedrock.json

      # The denials for ceiling-blocked items should be visible, not inferred.
      - name: Model call log
        if: always()
        run: python -m provenance.usage --hours 24

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-bedrock
          path: eval-report-bedrock.json

# The former setup recipe for Bedrock via OIDC became the full-bedrock job above;
# the IAM side lives in infra/github-oidc-bedrock.sh.
