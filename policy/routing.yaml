# Routing policy. Rules are data, not code.
#
# Evaluated top to bottom; the first matching rule decides. If no rule matches, the
# request is denied — the default is at the bottom and it is a deny, so a policy file
# that fails to cover a case fails closed rather than falling through to allow.
#
# In production this belongs in OPA, where the same rules become Rego and can be
# tested, versioned, and distributed independently of the application. The shape here
# is deliberately OPA-compatible: a decision, a reason, and a rule id on every answer.
#
# Match keys (all optional; an absent key matches anything):
#   classification  most sensitive classification in the retrieved context
#   tier            local | cloud, from the model registry
#   status          approved | deprecated | retired, from the model registry
#   region          where inference physically runs, from the model registry
#   groups_any      caller holds at least one of these groups
#
# A list value means any-of: `region: [us]` matches a model whose region is us.

rules:
  - id: retired-model-refused
    match: { status: retired }
    decision: deny
    reason: Model is retired in the registry

  - id: restricted-stays-local
    match: { classification: restricted, tier: cloud }
    decision: deny
    reason: Restricted content may not be sent to an external provider

  - id: confidential-stays-local
    match: { classification: confidential, tier: cloud }
    decision: deny
    reason: Confidential content may not be sent to an external provider

  - id: local-any-classification
    match: { tier: local, status: approved }
    decision: allow
    reason: Self-hosted inference is approved for all classifications

  - id: local-deprecated-allowed
    match: { tier: local, status: deprecated }
    decision: allow
    reason: Deprecated model still approved; migrate before retirement

  - id: cloud-public-internal
    match: { classification: internal, tier: cloud, status: approved, region: [us] }
    decision: allow
    reason: Internal content is approved for the external provider in US regions

  - id: cloud-public
    match: { classification: public, tier: cloud, status: approved, region: [us] }
    decision: allow
    reason: Public content is approved for the external provider in US regions

  # Residency: the cloud allows above are scoped to US regions, so any cloud model
  # that reaches this rule runs somewhere no rule approves. An explicit deny with
  # the real reason, rather than letting it fall to the generic default.
  - id: residency-us-only
    match: { tier: cloud }
    decision: deny
    reason: Inference region is not approved; cloud inference is permitted in US regions only

  - id: default-deny
    match: {}
    decision: deny
    reason: No rule permits this combination

# When a request is denied, fall back to this model rather than failing the request,
# provided the fallback itself passes policy. Set to null to fail the request instead.
fallback_model: ollama/llama3.1:8b

# Steering: which model takes a request nobody pinned. Consulted only when the caller
# named no model and DEFAULT_MODEL is unset, so an eval or CI job always measures the
# model it pinned. The first matching rule nominates candidates in preference order;
# every candidate still passes the rules above and the budgets below — steering
# prefers, policy permits. Classification is the match key because it is the one
# request fact that varies here: prompt size is nearly constant at TOP_K=8 (p50
# ~1.8K tokens across 1,144 ledger calls). Remove the section to make unpinned
# requests use the registry default, as before.
steering:
  - id: steer-quality-cloud
    match: { classification: [public, internal] }
    prefer: [bedrock/claude-sonnet-4-6, ollama/llama3.1:8b]
    reason: Sonnet is the measured-best model on this corpus (FINDINGS 13 and 18)
      and may see public and internal content; spend is bounded by the budgets
      below, and over budget the request degrades to the local fallback

  - id: steer-local
    match: {}
    prefer: [ollama/llama3.1:8b]
    reason: Everything else stays on self-hosted hardware; steering never nominates
      a model the rules above would have to refuse

# Spend ceilings, enforced at the gateway before a model is invoked. Spend is the
# ledger's sum of cost_usd over a rolling window, so the ledger is the source of
# truth for enforcement, not just attribution. A model over its ceiling — or any
# paid call once the total is reached — is denied like any other rule
# (budget-model-exceeded / budget-total-exceeded) and the request degrades to the
# fallback instead of failing. Models with zero cost rates are exempt: a free call
# adds no spend, and the point of a budget is spend, not traffic.
# Remove the section (or a key) to disable that ceiling.
# principal_usd caps each caller's paid spend in the window; principals: overrides
# the default for named callers (evals and the red team run as sam). A call with no
# principal is metered as one shared anonymous bucket under the default cap — if
# anonymous calls were exempt, omitting the principal would be the bypass.
budgets:
  window_hours: 24
  total_usd: 10.00
  models:
    bedrock/claude-sonnet-4-6: 5.00
  principal_usd: 2.00
  principals:
    sam: 5.00
